# AniSync 字幕组 / 压制组排名
#
# scope: main —— 只参与挑主 RSS。副 RSS 由 raws.yaml 负责。
# in: group   —— 这条规则只看组名，不看资源标题。
#
# 组名怎么写：**写 ANI-RSS 选组界面上显示的那个名字就行。**
# AniSync 拿到的候选本来就带这个名字；同时它还会把资源标题方括号里印出来的名字
# 一并当成这个组的别名 —— 所以显示名和种子名对不上时（猎户发布组 / [猎户压制部]），
# 写哪一个都能命中，不用两个都写，也不用手工核对。
#
# 拿不准某个组叫什么：在 ANI-RSS 里选中它，界面上显示的就是它的名字。
#
# in: group 还顺带解决了短名字的问题。ANi / Judas / ASW / DKB 这类名字，
# 以前和标题混在一起匹配时会被作品名误伤（「Ani ni Tsukeru Kusuri wa Nai」里的 Ani），
# 只能写成 ^ani\b|\[ani\] 去绕；现在只看组名，^ani\b 就够了。
#
# 顺序就是偏好，数字越小越优先。这份名单只是一个起点 ——
# **你的组做哪些版本（简日内嵌 / 繁日内嵌 / 简繁内封 / 多语），
# 在 ANI-RSS 里选中一个组就能看到**（它把每个组标题里出现过的标签组合列出来）。
# 按你实际要的版本调整顺序即可，不用照抄这里的排法。

- {name: LoliHouse,     match: '(?i)lolihouse',                  priority: 10,  scope: main, in: group}
- {name: 桜都字幕组,     match: '(?i)sakurato|桜都|樱都',           priority: 20,  scope: main, in: group}
- {name: 喵萌奶茶屋,     match: '(?i)喵萌奶茶屋|喵萌|nyamoe',        priority: 30,  scope: main, in: group}
- {name: 绿茶字幕组,     match: '(?i)绿茶字幕组|綠茶字幕組',          priority: 40,  scope: main, in: group}
- {name: 北宇治字幕组,   match: '(?i)北宇治',                       priority: 50,  scope: main, in: group}
- {name: 三明治摆烂组,   match: '(?i)三明治摆烂组|三明治擺爛組',      priority: 60,  scope: main, in: group}
- {name: 猎户发布组,     match: '(?i)猎户',                         priority: 70,  scope: main, in: group}
- {name: 拨雪寻春,       match: '(?i)拨雪寻春|撥雪尋春',             priority: 80,  scope: main, in: group}
- {name: 悠哈璃羽字幕社, match: '(?i)悠哈璃羽',                     priority: 90,  scope: main, in: group}
- {name: 银光字幕组,     match: '(?i)银光字幕组|銀光字幕組',          priority: 100, scope: main, in: group}
- {name: 雪飄工作室,     match: '(?i)雪飄|雪飘|flsnow',             priority: 110, scope: main, in: group}
- {name: 亿次研同好会,   match: '(?i)亿次研|億次研|billion meta lab', priority: 120, scope: main, in: group}
- {name: MingYSub,      match: '(?i)^mingy',                      priority: 130, scope: main, in: group}
- {name: SweetSub,      match: '(?i)sweetsub',                    priority: 140, scope: main, in: group}
- {name: 黑白字幕组,     match: '(?i)黑白字幕组|黑白字幕組',          priority: 150, scope: main, in: group}
- {name: TSDM字幕组,     match: '(?i)tsdm',                        priority: 160, scope: main, in: group}
- {name: 银色子弹字幕组, match: '(?i)银色子弹|銀色子彈',              priority: 170, scope: main, in: group}
- {name: 极影字幕社,     match: '(?i)极影|極影',                     priority: 180, scope: main, in: group}
- {name: 豌豆字幕组,     match: '(?i)豌豆',                         priority: 190, scope: main, in: group}
- {name: 樱桃花字幕组,   match: '(?i)樱桃花|櫻桃花',                  priority: 200, scope: main, in: group}
- {name: 冷番补完字幕组, match: '(?i)冷番补完',                      priority: 210, scope: main, in: group}

# 没被点名的组不会被删掉，只是排在这些之后（未命中规则的基准优先级是 1000）。
# 想让某个组彻底出局，写进 deny.yaml。
#
# 上面有几条写了简繁两种写法（绿茶字幕组|綠茶字幕組）—— 那不是「一个组的两个名字」，
# 而是同一个名字的两种字形。别名机制对不上简繁，字不一样就得多写一个。
