# AniSync 配置样例 01：中文优先（推荐先用这个）
#
# 适合：追当季周更番剧，想要简体/繁体中文内嵌或内封，不想为每部番剧手动挑字幕组。
#
# 怎么用：
#   1. 整份复制成程序同目录的 config.yaml
#   2. 改下面 instances 里的 baseUrl 和 apiKey
#   3. AniSync check      校验配置、测试实例连通性
#   4. AniSync plan       看一眼要改什么（只读，不写）
#   5. AniSync sync -y    执行
#
# 怎么改：rules.primary 就是「偏好顺序」，priority 数字越小越优先。
# 想捧哪个组就把它的 priority 调小；想踩哪个组就把它的 priority 调大或写进 rules.deny。
# 组名的准确写法查同目录的 groups.md。

# 本地设置页监听地址；托盘模式下点「打开设置」会开这个地址。
listen: 127.0.0.1:51837

# 访问站点用的代理。留空则用环境变量 ANISYNC_PROXY，其次 HTTPS_PROXY / HTTP_PROXY。
# 从国内直连 nyaa.si、api.bgm.tv 与封面图床 lain.bgm.tv 通常不通，配一个本地代理最省事。
# 设置页的「网络与代理」里也能改这一项。
# proxy: http://127.0.0.1:7890

sources:
  # 站点数据借用哪个实例的接口；留空 = 第一个启用的实例。
  instance: ""
  # 爬取优先级。anibt 走实例接口（字幕组维度、API 齐全），nyaa 由 AniSync 自己按关键字搜。
  # 两家覆盖面互补，默认就这两家。animegarden / mikan 也能写进来，但和 anibt 是同一类
  # 实例接口，换不回额外覆盖面。
  order: [anibt, nyaa]
  stopOnFirstMatch: false   # true = 第一个有结果的站点就停，快但副 RSS 会变少
  timeoutSeconds: 25
  cacheMinutes: 720         # 站点数据缓存 12 小时，后台自动跑时不必反复翻站点

rules:
  # 每条订阅保留几条副 RSS。多数人只要一条备胎，所以默认 1。
  # 「所有版本都收」的人把它调大（比如 3），并在下面把想要的组都点一遍名。
  maxStandby: 1

  primary:
    # ---- 第一段：语言类型。同一部番剧有多个组在做时，先按你要的字幕类型分档 ----
    # 注意顺序：简繁（简繁日内封）必须排在繁日前面，否则「简繁日」会先被繁日规则吃掉。
    - {name: 简日内嵌,   match: '(?i)简日|簡日|简体|簡體|\bchs\b', priority: 10, scope: main}
    - {name: 简繁日内封, match: '(?i)简繁|簡繁|内封|內封',         priority: 20, scope: main}
    - {name: 繁日内嵌,   match: '(?i)繁日|繁体|繁體|\bcht\b',      priority: 30, scope: main}

    # ---- 第二段：中文组偏好。按 groups.md 里的活跃度大致排的，可以随意调 ----
    - {name: 桜都字幕组,     match: '(?i)sakurato|桜都|樱都',              priority: 40, scope: main}
    - {name: 喵萌奶茶屋,     match: '(?i)喵萌奶茶屋|喵萌|nyamoe',          priority: 41, scope: main}
    - {name: 绿茶字幕组,     match: '(?i)绿茶字幕组|綠茶字幕組',           priority: 42, scope: main}
    - {name: 北宇治字幕组,   match: '(?i)北宇治',                          priority: 43, scope: main}
    - {name: 三明治摆烂组,   match: '(?i)三明治摆烂组|三明治擺爛組',       priority: 44, scope: main}
    - {name: 悠哈璃羽字幕社, match: '(?i)悠哈璃羽',                        priority: 45, scope: main}
    - {name: 猎户发布组,     match: '(?i)猎户发布组|獵戶發佈組',           priority: 46, scope: main}
    - {name: 雪飄工作室,     match: '(?i)雪飄|雪飘|flsnow',                priority: 47, scope: main}
    - {name: 拨雪寻春,       match: '(?i)拨雪寻春|撥雪尋春',               priority: 48, scope: main}
    - {name: 亿次研同好会,   match: '(?i)亿次研|億次研',                   priority: 49, scope: main}
    - {name: 樱桃花字幕组,   match: '(?i)樱桃花|櫻桃花',                   priority: 50, scope: main}
    - {name: MingYSub,       match: '(?i)mingysub',                        priority: 51, scope: main}
    - {name: 黑白字幕组,     match: '(?i)黑白字幕组|黑白字幕組',           priority: 52, scope: main}
    - {name: TSDM字幕组,     match: '(?i)tsdm',                            priority: 53, scope: main}
    - {name: 银色子弹字幕组, match: '(?i)银色子弹|銀色子彈',               priority: 54, scope: main}
    - {name: SweetSub,       match: '(?i)sweetsub',                        priority: 55, scope: main}
    - {name: 爱恋字幕社,     match: '(?i)爱恋字幕社|愛戀字幕社',           priority: 56, scope: main}
    - {name: 咪路fans制作组, match: '(?i)咪路',                            priority: 57, scope: main}
    - {name: 豌豆字幕组,     match: '(?i)豌豆字幕组|豌豆字幕組',           priority: 58, scope: main}
    - {name: 丸子家族,       match: '(?i)丸子家族',                        priority: 59, scope: main}

    # ---- 第三段：副 RSS 的放流组排名不写在这里，放在 standby.yaml ----
    # 见下面 rules.primaryFiles。这样换口味只改那个文件，主配置不用动。

  # 白名单（放流组排名）与黑名单各放一个文件，不写死在主配置里：
  #   standby.yaml   副 RSS 只放这里点过名的组，顺序就是优先级
  #   deny.yaml      命中即整个剔除
  # 相对路径按本文件所在目录解析；文件读不出来会直接报错，不会静默跳过。
  # 内联的 primary / deny 仍然有效，顺序是「内联在前、文件按声明顺序在后」。
  primaryFiles: [standby.yaml]
  denyFiles: [deny.yaml]

  # 内联的黑名单：放「个人口味」这一类，和共享的 deny.yaml 分开。
  deny:
    # 周更观看不要合集/全集，一个种子几百集会把追番列表搞乱。
    # 想要合集就把这一行删掉（参考 02 号样例）。
    - {match: '合集|全集|(?i)\bbatch\b', why: 不要合集}

instances:
  - name: 主库
    baseUrl: https://ass.example.com/
    # apiKey 支持 ${ENV} 写法，避免密钥明文落盘。
    # 也可以在设置页里直接填，程序会以 0600 权限保存 config.yaml。
    apiKey: ${ANISYNC_KEY}

# 按番剧规定季度与剧集偏移（和 ANI-RSS 的 Ani.season / Ani.offset 一致）。
# 季度按番剧给一个值；集偏移按 RSS 分开给：offset 管主 RSS，standbyOffset 管副 RSS。
# 留空 = 不碰订阅里已有的值，让 ANI-RSS 按每个 RSS 的实际集数自己推断 —— 多数番剧不需要写。
# 只有「RSS 从第 13 集接着数」这种确实要改的，才在这里写一条。
targets: []
#  - title: 冰之城墙          # 也可以写 bgmId 精确匹配
#    bgmId: "665390"
#    season: 2                # 该番剧的所有订阅共用这一个季度值
#    offset: -12              # 主 RSS 从第 13 集开始数 -> 减 12
#    standbyOffset: -12       # 副 RSS 单独给，可以和主 RSS 不一样

sync:
  intervalMinutes: 0    # 后台自动爬取间隔（分钟）；0 = 不自动。托盘模式下生效
  preview: false        # true = 只生成计划不写入
  addMissing: false     # targets 里实例没有的番剧是否自动新增

discover:
  # 自动发现：扫一遍现在有什么番剧在放，把实例里没有的补进去。
  # 默认关。想用就设成 true，或临时加 --discover 跑一次看看（AniSync plan --discover）。
  # 详见 04 号样例。
  enabled: false
  # 只用 Yuc 的当季番剧表：它本身就是人工整理的日本番剧表，
  # Bangumi 只负责补 bgmId（匹配走日文原名，中文译名各家写法不一样，对不上）。
  sources: [yuc]
  limit: 50
