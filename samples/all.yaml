# AniSync「谁都行」规则：任意非空组名都命中，全部同一档。
#
# 给 04 号全收样例用。规则里没有任何偏好 —— 谁当主 RSS、谁进副 RSS，
# 全交给引擎兜底：发布条数 -> 站点顺序 -> 组名。黑名单（deny.yaml）照旧生效。
#
# in: group —— 只看组名，标题不参与。
# .+       —— 匹配任意非空组名（名字为空的候选在适配层就被丢掉了）。
#
# 想要「有偏好 + 兜底全收」，把这个文件放在偏好文件后面：
#   primaryFiles: [raws.yaml, subs.yaml, all.yaml]
# 匹配是「按声明顺序，第一条命中的生效」，所以前面的档位先挑，
# 没被前面点过名的组全部落到这里 —— 一个都不落下。
- {name: 全收, match: '.+', priority: 500, scope: both, in: group}
