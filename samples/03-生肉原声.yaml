# AniSync 配置样例 03：生肉 / 日语原声 / 多语
#
# 适合：自己压、自己配字幕，或者要日语音轨 + 外挂字幕；不想让内嵌版占掉主 RSS。
#
# 和 01 的区别：主 RSS 优先要带 RAW / 生肉 / 多语标记的，副 RSS 用英文放流组的 MultiSub
# （MultiSub 版通常带日语音轨，是很好的生肉备选）。
#
# 怎么用：整份复制成 config.yaml，改 instances，然后 AniSync check / plan / sync。

listen: 127.0.0.1:51837
# proxy: http://127.0.0.1:7890

sources:
  instance: ""
  order: [anibt, nyaa]
  stopOnFirstMatch: false
  timeoutSeconds: 25
  cacheMinutes: 720

rules:
  maxStandby: 3

  primary:
    # ---- 第一段：明确标了 RAW / 生肉 / 多语的优先 ----
    - {name: 生肉RAW,  match: '(?i)\braw\b|生肉|無字幕|无字幕', priority: 5,  scope: main}
    - {name: 多语字幕, match: '(?i)multi-?sub|多语字幕',        priority: 10, scope: main}

    # ---- 第二段：生肉 / 原声向的组 ----
    # 这些是按真实发布数据挑的：Nix-Raws 走 WEB-DL 内封，天月動漫發佈組 多语居多，
    # 夜莺家族 是简日 + 生肉混合，ANi 是台湾 Baha 的繁体硬字幕。
    - {name: Nix-Raws,       match: '(?i)nix-raws|nc-raws',   priority: 20, scope: main}
    - {name: 天月動漫發佈組, match: '(?i)天月',                priority: 21, scope: main}
    - {name: 夜莺家族,       match: '(?i)夜莺家族|夜鶯家族',   priority: 22, scope: main}
    - {name: ANi,            match: '(?i)\bani\b|baha',       priority: 23, scope: main}

    # ---- 第三段：BD / 压制组，收原盘压制时用 ----
    - {name: 压制组, match: '(?i)vcb-studio|h-enc|未央阁', priority: 30, scope: main}

    # ---- 副 RSS 的放流组排名不写在这里，放在 standby-raw.yaml ----
    # 生肉向的排序和 01 号不一样（英文放流组的 MultiSub 排前面），所以单独一个文件。
    # 见下面 rules.primaryFiles。

  # 白名单与黑名单各放一个文件。生肉向用的是 standby-raw.yaml 这个变体 ——
  # 想换回中文优先的排序，把这里改成 standby.yaml 就行，主配置一个字都不用动。
  primaryFiles: [standby-raw.yaml]
  denyFiles: [deny.yaml]

  # 内联的黑名单：个人口味放在这里。
  deny:
    - {match: '合集|全集', why: 不要合集}

instances:
  - name: 主库
    baseUrl: https://ass.example.com/
    apiKey: ${ANISYNC_KEY}

targets: []

sync:
  intervalMinutes: 0
  preview: false
  addMissing: false

discover:
  enabled: false
  sources: [yuc]
  days: 180
  limit: 50
