# AniSync 黑名单：命中即整个剔除该候选。
#
# 单独放一个文件，因为这类内容最常改，而且它和「偏好排序」是两件事：
# 白名单（standby.yaml）决定谁优先，黑名单决定谁根本不要。
#
# 在 config.yaml 里这样引用：
#   rules:
#     denyFiles: [deny.yaml]
#
# 格式与 rules.deny 完全一样：{match: 正则, why: 说明}。
# match 的匹配对象是「字幕组名 + 最近的资源标题 + RSS 地址」，
# 所以既能挡组名，也能挡「合集」「720p」这类内容特征。
# 相对路径按 config.yaml 所在目录解析；文件读不出来会直接报错，不会静默跳过。

# ---------- 明确不要的组 ----------
# Kirara Fantasia：2833 条样本、语言标记 0，标题实际是 [黒ネズミたち] 的生肉搬运。
# 不挡的话它会靠「发布条数」的兜底排序刷满副 RSS（实测十条副 RSS 里占八条）。
- {match: '(?i)kirara ?fantasia|黒ネズミたち', why: 生肉搬运刷榜，会占掉副 RSS 位置}
# JMAX：蜜柑上的聚合发布者，一个条目里混着 Nix-Raws / ANi / MagicStar 好几家的东西。
- {match: '(?i)jmax', why: 聚合发布者，条目里混着多个组}
# TOC：^ 锚定在组名开头，不会误伤标题里带 toc 的条目。
- {match: '(?i)^toc\b', why: 不要的组}
# SkyMoonAnime：在 AnimeGarden 是「发布者」身份（id 29），不在 727 个注册字幕组里。
- {match: '(?i)skymoon', why: 不要的组}
# 沸羊羊字幕组（蜜柑 id 4729）与 沸班亚马制作组（id 672）是同一家的两个名字，两个都写。
- {match: '沸羊羊|沸班亚马', why: 不要的组}

# ---------- 内容层面的过滤 ----------
# 蜜柑对「认不出字幕语言」的条目会给这个占位名。
- {match: '生肉|不明字幕', why: 认不出字幕语言的占位条目}
# 华语原声的国漫放流。追国漫的话把这一行删掉。
- {match: '(?i)doomdos|gm-team|shridhuu', why: 国漫放流，不是日本番剧}

# 「不要合集」「不要 720p」这类是个人口味，而且各份样例不一样
# （收藏党恰恰要合集），所以放在各自 config.yaml 的 rules.deny 里，不塞进这个共享文件。
