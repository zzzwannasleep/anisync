# AniSync 黑名单：命中即整个剔除该候选。
#
# 单独放一个文件，因为这类内容最常改，而且它和「偏好排序」是两件事：
# 排名文件决定谁优先，黑名单决定谁根本不要。
#
# 在 config.yaml 里这样引用：
#   rules:
#     denyFiles: [deny.yaml]
#
# 格式与 rules.deny 完全一样：{match: 正则, why: 说明}。
# match 的匹配对象是「字幕组名 + 最近的资源标题 + RSS 地址」，
# 所以既能挡组名，也能挡「合集」「720p」这类内容特征。
# 相对路径按 config.yaml 所在目录解析；文件读不出来会直接报错，不会静默跳过。

# ---------- 搬运 / 聚合，产量极高但认不出字幕语言 ----------
# Kirara Fantasia：在 AnimeGarden 注册的名字是 Kirara Fantasia，
# 但种子标题里的组名是 黒ネズミたち（扫 727 个组核出来的）。两个都要写。
# 不挡的话它会靠「发布条数」的兜底排序挤满副 RSS。
- {match: '(?i)kirara ?fantasia|黒ネズミたち|黑鼠', why: 生肉搬运刷榜，会占掉副 RSS 位置}
# JMAX：蜜柑上的聚合发布者，一个条目里混着 Nix-Raws / ANi / MagicStar 好几家的东西。
# 它不在 AnimeGarden 的 727 个注册组里，只在蜜柑侧出现。
- {match: '(?i)jmax', why: 聚合发布者，条目里混着多个组}

# ---------- 明确不要的组 ----------
# 沸羊羊字幕组 与 沸班亚马制作组 是同一家的两个名字，两个都写。
- {match: '沸羊羊|沸班亚马', why: 不要的组}

# ---------- 内容层面的过滤 ----------
# 蜜柑对「认不出字幕语言」的条目会给这个占位名。
- {match: '生肉|不明字幕', why: 认不出字幕语言的占位条目}
# 华语原声的国漫放流（这三个只在 Nyaa 侧出现）。
# GMTeam 在 AnimeGarden 注册，种子里的名字是 GM-Team。
- {match: '(?i)doomdos|gm-?team|shridhuu', why: 国漫放流，不是日本番剧}

# ---------- 一个已经踩过的坑 ----------
# 不要写 `(?i)skymoon`。
# 天月動漫發佈組 在 AnimeGarden 注册，但它种子标题里的组名是 **Skymoon-Raws** ——
# 挡 skymoon 会把 天月動漫發佈組 一起挡掉。真要挡天月就写 `天月動漫發佈組|Skymoon-Raws`，
# 别只写 skymoon，那样看不出自己挡掉了谁。

# 「不要合集」「不要 720p」这类是个人口味，各份样例不一样，放在各自
# config.yaml 的 rules.deny 里，不塞进这个共享文件。
