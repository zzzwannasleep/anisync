# AniSync 配置样例 02：收藏党（蓝光 / 内封 / 高码率优先）
#
# 适合：不追周更，等 BD 或高码率 WEB 出来再收；要内封（软字幕）方便自己调字幕、抽音轨。
#
# 和 01 的区别就三点：
#   1. 主 RSS 优先要 BD / HEVC 10bit / 内封，而不是「简日内嵌」
#   2. 不挡合集 —— 收藏党恰恰要整季合集
#   3. 副 RSS 退成流媒体内嵌版，BD 还没出的时候先看着
#
# 怎么用：整份复制成 config.yaml，改 instances，然后 AniSync check / plan / sync。

listen: 127.0.0.1:51837
# proxy: http://127.0.0.1:7890

sources:
  instance: ""
  order: [anibt, nyaa]
  stopOnFirstMatch: false
  timeoutSeconds: 25
  cacheMinutes: 720

rules:
  maxStandby: 3

  primary:
    # ---- 第一段：封装形态。收藏看的是「怎么封的」，所以排在语言前面 ----
    - {name: 蓝光原盘压制, match: '(?i)bdrip|blu-?ray|bdmv',        priority: 5,  scope: main}
    - {name: 简繁内封,     match: '(?i)简繁|簡繁|内封|內封',        priority: 10, scope: main}
    - {name: 10bit HEVC,   match: '(?i)hevc|x265|10-?bit|ma10p',    priority: 20, scope: main}

    # ---- 第二段：压制组。按 groups.md 里走 BD 路线的组排 ----
    - {name: LoliHouse,   match: '(?i)lolihouse|萝莉屋',   priority: 30, scope: main}
    - {name: VCB-Studio,  match: '(?i)vcb-studio',         priority: 31, scope: main}
    - {name: Nix-Raws,    match: '(?i)nix-raws',           priority: 32, scope: main}
    - {name: 雪飄工作室,  match: '(?i)雪飄|雪飘|flsnow',   priority: 33, scope: main}
    - {name: SweetSub,    match: '(?i)sweetsub',           priority: 35, scope: main}
    - {name: Zzz睡不醒,   match: '(?i)zzz睡不醒',          priority: 36, scope: main}
    - {name: 未央阁联盟,  match: '(?i)未央阁',             priority: 37, scope: main}
    - {name: H-Enc,       match: '(?i)h-enc',              priority: 38, scope: main}

    # ---- 第三段：内嵌组兜底。BD 还没出时，至少有内嵌版能看 ----
    - {name: 中文组兜底, match: '(?i)桜都|喵萌|绿茶字幕组|綠茶字幕組|北宇治|三明治|悠哈璃羽|猎户发布组|撥雪尋春|拨雪寻春|MingYSub|TSDM|银色子弹|愛戀字幕社|爱恋字幕社', priority: 60, scope: main}

    # ---- 副 RSS 的放流组排名不写在这里，放在 standby.yaml ----
    # 见下面 rules.primaryFiles。

  # 白名单（放流组排名）与黑名单各放一个文件：
  #   standby.yaml   副 RSS 只放这里点过名的组，顺序就是优先级
  #   deny.yaml      明确不要的组
  primaryFiles: [standby.yaml]
  denyFiles: [deny.yaml]

  # 内联的黑名单：收藏党的口味和 01 号不一样，所以放在这里而不是共享文件里。
  deny:
    # 收藏不要 720p 以下的低清版本。
    - {match: '(?i)(480p|720p)', why: 收藏不要低清}
    # 注意这里没有「合集」—— 收藏党要合集，这是和 01 号最大的区别。

instances:
  - name: 主库
    baseUrl: https://ass.example.com/
    apiKey: ${ANISYNC_KEY}

# 收藏党的季度偏移一般更简单：BD 合集大多从第 1 集开始，不用改。
# 只有 TV 分季播出、RSS 接着上一季数集数时才需要写。
targets: []

sync:
  intervalMinutes: 0
  preview: false
  addMissing: false

discover:
  enabled: false
  sources: [yuc]
  days: 180
  limit: 50
