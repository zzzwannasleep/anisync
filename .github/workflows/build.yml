name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, goos: windows, goarch: amd64 }
          - { runner: windows-latest, goos: windows, goarch: arm64 }
          # darwin 双架构都在 macos-latest 上交叉编译即可：
          # macos-13（Intel）排队久且已被 GitHub 逐步淘汰，没必要为 amd64 单独占一个 runner
          - { runner: macos-latest,   goos: darwin,  goarch: arm64 }
          - { runner: macos-latest,   goos: darwin,  goarch: amd64 }
          - { runner: ubuntu-latest,  goos: linux,   goarch: amd64 }
          - { runner: ubuntu-latest,  goos: linux,   goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          suffix=""
          [ "$GOOS" = "windows" ] && suffix=".exe"
          go build -trimpath -ldflags '-s -w' -o "dist/assm-${GOOS}-${GOARCH}${suffix}" ./cmd/assm
      - uses: actions/upload-artifact@v7
        with:
          name: assm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
