name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # VERSION 由发布任务自己回写，避免「回写 -> 再触发 -> 再回写」的无限循环
    paths-ignore: ['VERSION']
  pull_request:
  workflow_dispatch:

jobs:
  # 版本号规则：VERSION 文件里存的是「下一次要发布的版本」，每次构建发它、然后 +0.0.1。
  # 打 v* 标签时以标签为准，不回写。
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      next: ${{ steps.v.outputs.next }}
      isTag: ${{ steps.v.outputs.isTag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "next=" >> "$GITHUB_OUTPUT"
            echo "isTag=true" >> "$GITHUB_OUTPUT"
          else
            current="$(tr -d '[:space:]' < VERSION)"
            IFS=. read -r major minor patch <<< "$current"
            echo "version=${current}" >> "$GITHUB_OUTPUT"
            echo "next=${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"
            echo "isTag=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 本次版本
        run: echo "本次发布 v${{ steps.v.outputs.version }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, goos: windows, goarch: amd64, cgo: '0' }
          - { runner: windows-latest, goos: windows, goarch: arm64, cgo: '0' }
          # darwin 需要 cgo（菜单栏图标是 Objective-C），因此必须在 macOS 上构建。
          # 两个架构都在 macos-latest 上交叉编译：macos-13（Intel）排队久且已被逐步淘汰。
          - { runner: macos-latest,   goos: darwin,  goarch: arm64, cgo: '1' }
          - { runner: macos-latest,   goos: darwin,  goarch: amd64, cgo: '1' }
          - { runner: ubuntu-latest,  goos: linux,   goarch: amd64, cgo: '0' }
          - { runner: ubuntu-latest,  goos: linux,   goarch: arm64, cgo: '0' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/AniSync-${GOOS}-${GOARCH}${suffix}" ./cmd/anisync
          ls -lh dist

      # 光「编译通过」不足以证明菜单栏真的编进去了：检查二进制是否链接了 Cocoa
      - name: verify menu bar is linked (darwin)
        if: matrix.goos == 'darwin'
        run: |
          set -euo pipefail
          binary="dist/AniSync-darwin-${{ matrix.goarch }}"
          otool -L "$binary"
          if ! otool -L "$binary" | grep -q Cocoa; then
            echo "✗ 未链接 Cocoa：菜单栏代码没有编进二进制"
            exit 1
          fi
          echo "✓ 已链接 Cocoa —— 原生菜单栏代码确实编入了二进制"

      - name: package .app bundle (darwin)
        if: matrix.goos == 'darwin'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/package-macos.sh "dist/AniSync-darwin-${{ matrix.goarch }}" "$VERSION" "${{ matrix.goarch }}"

      # 发布物一律是 zip：解压出来是一个 AniSync/ 文件夹，程序本体、配置示例、
      # 样例都在里面，运行期文件也只会写在这个文件夹里（见 internal/workdir）。
      - name: package zip
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            go run ./scripts/pack -version "$VERSION" -os macos -arch "${{ matrix.goarch }}" \
              -app dist/AniSync.app
          else
            suffix=""
            if [ "${{ matrix.goos }}" = "windows" ]; then suffix=".exe"; fi
            go run ./scripts/pack -version "$VERSION" -os "${{ matrix.goos }}" \
              -arch "${{ matrix.goarch }}" \
              -bin "dist/AniSync-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}"
          fi
          ls -lh dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: AniSync-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip

  # 构建全部通过后才发版：构建挂了不会白白吃掉一个版本号。
  release:
    if: github.event_name != 'pull_request'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # 硬性门禁：发布目录里除了 zip 不许有别的东西。
      # 「程序产生的文件只在解压出来的文件夹里」这条约定靠发布物形态兜底，
      # 混进一个裸二进制就等于破了一半。
      - name: 确认发布物全是 zip
        run: |
          set -euo pipefail
          stray="$(find artifacts -type f ! -name '*.zip' -print)"
          if [ -n "$stray" ]; then
            echo "✗ 发布目录里有非 zip 文件："
            echo "$stray"
            exit 1
          fi
          echo "✓ $(find artifacts -type f -name '*.zip' | wc -l) 个发布物，全部是 zip"
          ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: AniSync v${{ needs.version.outputs.version }}
          files: artifacts/*.zip
          generate_release_notes: true

      - uses: actions/checkout@v7
        if: needs.version.outputs.isTag == 'false'
        with:
          ref: main

      - name: 回写下一次版本号
        if: needs.version.outputs.isTag == 'false'
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          set -euo pipefail
          echo "$NEXT" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: 下一个版本号 ${NEXT} [skip ci]"
          git push origin main
